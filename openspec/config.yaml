schema: spec-driven

context: |
  Семейный финансовый менеджер: Vue 3 + Vite, статическая сборка без бэкенда,
  данные в localStorage. Интерфейс и все артефакты - на русском.

  Слои и направление зависимостей строго одностороннее:
  advice.js -> scenarios.js -> finance.js -> money.js. Обратных импортов нет.
  Новую логику класть на правильный слой: базовый расчёт денег и прогноза - в
  finance.js; ходы/what-if/переносы - в scenarios.js; правила-рекомендации - в
  advice.js. Компоненты тонкие: читают state, зовут чистые функции, мутируют
  через CRUD стора.

  Денежные инварианты: любая величина хранится как { amount, currency } в
  нативной валюте и сводится к рублю только в точке расчёта; разные валюты не
  складываются напрямую. Ставки (apr) - доля (0.619 = 61.9%), проценты за
  период считаются простой формулой apr * сумма * дни / 365.

  Даты локальные без сдвига TZ (new Date(y, m, d)); toISOString в
  продакшен-коде не используется - это осознанное решение, не баг.

  Тесты - node --test на чистых функциях (finance.js, scenarios.js,
  advice.js). Vue-компоненты тестами не покрываются, проверяются вручную.

rules:
  specs:
    - Писать на русском, прямыми кавычками, без длинных и средних тире - только дефис
    - Описывать наблюдаемое поведение и финансовые инварианты, а не реализацию построчно
    - Приводить точные формулы там, где они есть
  tasks:
    - Новая логика - чистой функцией на правильном слое плюс тест на том же слое
